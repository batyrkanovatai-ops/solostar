<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Solostar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="menuScreen">
  <div class="menu-inner">

    <div class="brand">
      <span class="brand-credit">art by Atai · 177 school, Bishkek</span>
      <h1 class="brand-title">SOLOSTAR</h1>
    </div>

    <input id="nameInput" class="name-input" type="text" placeholder="Твой ник" maxlength="12">

    <div id="brawlerGrid" class="brawler-grid"></div>

    <div id="statusText" class="status-text"></div>
    <button id="startRoomBtn" class="btn btn-primary" style="display:none;">Начать матч</button>

    <div class="actions">
      <button id="quickplayBtn" class="btn btn-primary">Быстрый бой</button>
      <div class="room-row">
        <button id="createRoomBtn" class="btn btn-secondary">Создать комнату</button>
        <input id="roomCodeInput" class="code-input" type="text" placeholder="КОД" maxlength="5">
        <button id="joinRoomBtn" class="btn btn-secondary">Войти</button>
      </div>
    </div>

  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
