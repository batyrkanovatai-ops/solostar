<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solostar Mobile</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="menu" class="screen">
        <div class="author-credits">art by Atai from 117 school Bishkek</div>
        <h1 class="logo">SOLOSTAR</h1>
        <p class="subtitle">Выбери бойца и создай комнату</p>

        <div class="card-container">
            <h3>Выбери персонажа:</h3>
            <div id="brawlers-list" class="brawlers-grid"></div>
        </div>

        <div class="controls-panel">
            <div class="buttons-group">
                <button id="btn-create" class="btn primary">Создать комнату</button>
                <div class="join-box">
                    <input type="text" id="room-input" placeholder="Код комнаты" maxlength="6">
                    <button id="btn-join" class="btn secondary">Войти</button>
                </div>
            </div>
        </div>
    </div>

    <div id="lobby-screen" class="screen hidden">
        <h2>Комната: <span id="room-id-display">------</span></h2>
        <div id="players-list" class="card-container"></div>
        <button id="start-game-btn" class="btn primary">Начать игру</button>
    </div>

    <div id="game-screen" class="hidden">
        <canvas id="game-canvas"></canvas>
        <div id="touch-controls">
            <div id="joystick-zone">
                <div id="joystick-base">
                    <div id="joystick-stick"></div>
                </div>
            </div>
            <button id="attack-btn">ATTACK</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/brawlers/characters.js"></script>
    <script src="/controls/joystick.js"></script>
    <script src="/graphics/renderer.js"></script>
    <script src="/game.js"></script>
</body>
</html>
